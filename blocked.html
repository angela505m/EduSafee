<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sitio bloqueado - EduSafe</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body {
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--color-bg);
    padding: 30px;
  }
  .card {
    background: var(--color-card);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    padding: 48px 44px;
    max-width: 560px;
    width: 100%;
    border: 1px solid var(--color-border);
  }
  .card-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
  }
  .card-header .titulo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--color-primary);
  }
  .card-header .subtitulo {
    font-size: 13px;
    color: var(--color-text-muted);
  }
  .aviso {
    background: var(--color-bg-mint);
    border-left: 4px solid var(--color-primary);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 20px;
  }
  .aviso p {
    margin: 0;
    font-size: 16px;
    line-height: 1.5;
  }
  .aviso .motivo {
    font-size: 14px;
    color: var(--color-text-muted);
    margin-top: 6px;
  }
  .educativo {
    display: flex;
    gap: 16px;
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 20px 22px;
    margin-top: 12px;
  }
  .educativo .icono {
    width: 40px;
    height: 40px;
    border-radius: var(--radius-sm);
    flex-shrink: 0;
    background: var(--color-secondary-light);
    color: var(--color-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }
  .educativo strong {
    font-size: 15px;
    display: block;
    margin-bottom: 5px;
    color: var(--color-primary);
  }
  .educativo p {
    margin: 0;
    font-size: 14px;
    color: var(--color-text-muted);
    line-height: 1.6;
  }
  .btn-volver {
    margin-top: 24px;
    display: inline-block;
    padding: 10px 24px;
    background: var(--color-primary);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .btn-volver:hover {
    background: var(--color-primary-dark);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <span class="logo-shield">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <rect x="2" y="2" width="36" height="36" rx="8" fill="#2C3E50"/>
          <text x="20" y="27" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">E</text>
        </svg>
      </span>
      <div>
        <div class="titulo">EduSafe</div>
        <div class="subtitulo">Protección familiar</div>
      </div>
    </div>

    <div class="aviso">
      <p><strong>⛔ Acceso denegado</strong></p>
      <p class="motivo" id="detalleMotivo">Razón: este sitio está restringido por el responsable.</p>
    </div>

    <div class="educativo">
      <span class="icono">💡</span>
      <div>
        <strong id="categoria">Consejo digital</strong>
        <p id="mensajeEducativo">Cargando mensaje educativo...</p>
      </div>
    </div>

    <button class="btn-volver" onclick="history.back()">← Volver atrás</button>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
